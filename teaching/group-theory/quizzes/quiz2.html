<style>
.quiz{max-width:44rem}
.opens{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.2rem);line-height:1.2;margin:0 0 .3em}
.count{font-family:var(--sans);font-size:clamp(2.4rem,1.8rem + 3vw,3.6rem);font-weight:600;font-variant-numeric:tabular-nums;color:var(--link);margin:0 0 1.2em}
.pwbox{margin-top:1.4em;padding:20px 22px;border:1px solid var(--rule);border-radius:6px}
.pwbox label{display:block;font-family:var(--sans);font-size:1rem;font-weight:600;color:var(--muted);margin-bottom:10px}
.pwrow{display:flex;gap:10px;flex-wrap:wrap}
.pwrow input{flex:1 1 12rem;min-width:0;font:1.1rem var(--sans);padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.pwrow button{font:600 1rem var(--sans);padding:11px 18px;border-radius:6px;border:1px solid var(--board);background:var(--board);color:var(--chalk);cursor:pointer}
.pwrow button:disabled{opacity:.6}
.pwmsg{margin:10px 0 0;font-family:var(--sans);font-size:.98rem;min-height:1.4em;color:var(--muted)}
.pwmsg.bad{color:#B5503F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pwmsg.bad{color:#E89A8E}}
:root[data-theme="dark"] .pwmsg.bad{color:#E89A8E}
.ps-links{margin:1.1em 0 0;font-family:var(--sans);font-size:1rem}
.ps-links a{color:var(--chalk);text-decoration-color:var(--yellow);text-decoration-thickness:1.5px;text-underline-offset:5px}
#questions{overflow-wrap:anywhere}
#questions .qmeta{font-family:var(--sans);font-weight:600;color:var(--muted);margin:0 0 1em}
#questions .qbox{padding:16px 20px;border:1px solid var(--rule);border-radius:6px;margin-bottom:1.6em}
#questions .qbox p{margin:0 0 .7em}#questions .qbox p:last-child{margin:0}
#questions h2{font-size:clamp(1.35rem,1.15rem + .8vw,1.7rem);margin:1.5em 0 .5em}
#questions .pts{font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--muted);white-space:nowrap}
#questions ol.parts{list-style:none;counter-reset:part;padding-left:2.2em;margin:0}
#questions ol.parts>li{counter-increment:part;position:relative;margin:0 0 .7em}
#questions ol.parts>li::before{content:"(" counter(part,lower-alpha) ")";position:absolute;left:-2.2em;font-weight:700}
#questions .katex{font-size:1.08em}
#questions .katex-display{margin:.7em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
#questions .eqs{display:flex;flex-wrap:wrap;align-items:center;column-gap:2.5em;margin:.5em 0}
#questions .eqs .katex-display{margin:.2em 0}
.rules{font-family:var(--sans);font-size:1rem;color:var(--muted);margin:-.6em 0 0}
.startbox,.endbox{padding:20px 22px;border:2px solid var(--link);border-radius:6px}
.startbox p,.endbox p{margin:0 0 .8em}.endbox p:last-child{margin:0}
.startbox button{font:600 1.05rem var(--sans);padding:12px 22px;border-radius:6px;border:1px solid var(--board);background:var(--board);color:var(--chalk);cursor:pointer}
.startbox button:disabled{opacity:.6}
.tbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;padding:10px 14px;margin:0 0 18px;border-radius:6px;background:var(--board);color:var(--chalk);font-family:var(--sans)}
.tbar .tleft{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.tbar.low .tleft{color:var(--yellow)}
.tbar .tend{font-size:.95rem;opacity:.85}

  </div>

          <p id="startp"></p>
          <button type="button" id="startbtn">Start</button>

        </form>
      </div>
    </div>
  </section>
</main>
